<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FitPath</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f3f0f2">
<style>
:root{--bg:#f3f0f2;--card:#fff;--ink:#3b3438;--mut:#766d73;--pri:#e87a9f;--pri2:#b93b66;--acc:#f6b8cb;--onpri:#3b2a31;--line:#e3dfe3;--r:20px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b1e;--card:#2a2529;--ink:#f3eaee;--mut:#b8aab1;--pri:#f2a0b9;--pri2:#f6b3c7;--acc:#f2a0b9;--onpri:#2b1e24;--line:#40373c;color-scheme:dark}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:520px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}h2{font-size:20px;font-weight:800;margin:22px 0 10px}h3{font-size:17px;font-weight:600}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
button,input,select{font:inherit;color:inherit}
button{border:0;border-radius:14px;padding:10px 16px;background:var(--pri);color:var(--onpri);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--pri2);border:1.5px solid var(--pri2)}
button.sm{padding:6px 12px;font-size:14px;border-radius:10px}
button.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:7px 14px;border-radius:99px;font-size:14px}
button.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
input,select{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.big{font:800 34px "Bricolage Grotesque",sans-serif}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{background:none;color:var(--mut);padding:6px 10px;font-size:13px;flex:1}
nav button.on{color:var(--pri2);font-weight:800}
.wk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:8px 0}
.badge{min-width:52px;height:52px;border-radius:16px;background:var(--acc);color:var(--onpri);display:grid;place-items:center;font:800 13px "Bricolage Grotesque",sans-serif;text-align:center}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border:0}
#pl{position:fixed;inset:0;background:#332c31;color:#f7eff2;z-index:50;display:none;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));flex-direction:column;justify-content:space-between;text-align:center}
#pl .t{font:800 110px/1 "Bricolage Grotesque",sans-serif}
#pl button{background:var(--acc);color:var(--onpri)}
#pl button.ghost{background:transparent;color:#f7eff2;border-color:#f7eff2}
.fg{color:var(--pri);display:block;flex:none}#pl .fg{color:var(--acc);margin:0 auto 8px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="pl" role="dialog" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),K="fitpath-v1";
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{g:{cal:2000,water:2000,steps:8000,wt:""},log:{},w:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,"0"),dk=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const day=(k=dk())=>S.log[k]||(S.log[k]={water:0,steps:0,meals:[],wo:[]});
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0),rate={Cardio:9,Strength:6,Yoga:3,Pilates:4,Stretch:2.5};
const raw=[
["Morning Wake-Up","Cardio","Jumping jacks:40,High knees:30,Butt kicks:30,Skater hops:40,Mountain climbers:30,Shadow boxing:40"],
["Fat-Burn Intervals","Cardio","Burpees:30,Squat jumps:40,Plank jacks:40,Fast feet:30,Lunge jumps:30,Star jumps:40"],
["Lower Body Strength","Strength","Squats:45,Reverse lunges:45,Glute bridges:45,Wall sit:40,Calf raises:40,Side lunges:45"],
["Upper Body Basics","Strength","Push-ups:30,Tricep dips:40,Plank shoulder taps:40,Pike push-ups:30,Superman hold:40,Plank:45"],
["Core Calisthenics","Strength","Crunches:40,Leg raises:40,Bicycle crunches:45,Russian twists:40,Dead bugs:40,Plank:60"],
["Gentle Flow Yoga","Yoga","Cat-cow:45,Downward dog:45,Low lunge left:45,Low lunge right:45,Warrior II:45,Child’s pose:60"],
["Core Pilates","Pilates","The hundred:45,Single leg stretch:45,Roll-up:40,Swimming:45,Side-lying leg lifts:45,Glute bridge:45"],
["Evening Stretch","Stretch","Neck rolls:30,Shoulder stretch:40,Hamstring stretch:45,Quad stretch:45,Hip opener:45,Spinal twist:45"],
["5-Minute Starter","Cardio","Jumping jacks:30,March in place:30,Squats:30,Wall sit:20,Glute bridge:30","Beginner"],
["Low-Impact Cardio","Cardio","Marching knees:40,Shadow boxing:40,Butt kicks:30,Fast feet:30,Squats:40","Beginner"],
["HIIT Blast","Cardio","Burpees:40,Squat jumps:40,Mountain climbers:40,Star jumps:40,Lunge jumps:40,Plank jacks:40,Burpees:40","Advanced"],
["Tabata Torch","Cardio","Jumping jacks:40,High knees:40,Skater hops:40,Squat jumps:40,Mountain climbers:40,Fast feet:40","Intermediate"],
["Glute Builder","Strength","Glute bridges:45,Reverse lunges:45,Squats:45,Side lunges:45,Calf raises:40,Wall sit:45","Intermediate"],
["Push Power","Strength","Push-ups:40,Pike push-ups:40,Tricep dips:40,Plank shoulder taps:40,Push-ups:40,Plank:60","Advanced"],
["Beginner Strength","Strength","Squats:30,Knee push-ups:25,Glute bridges:30,Plank:20,Reverse lunges:30,Superman hold:30","Beginner"],
["Total Body Burn","Strength","Squat jumps:40,Push-ups:40,Reverse lunges:40,Burpees:40,Mountain climbers:40,Plank:60,Glute bridges:40","Advanced"],
["Abs in 10","Strength","Crunches:40,Bicycle crunches:40,Leg raises:40,Russian twists:40,Mountain climbers:40,Plank:60,Dead bugs:40","Intermediate"],
["Sun Salutation Flow","Yoga","Cat-cow:45,Downward dog:45,Low lunge left:40,Low lunge right:40,Cobra pose:40,Child’s pose:60","Beginner"],
["Power Yoga","Yoga","Downward dog:45,Warrior I left:45,Warrior I right:45,Chair pose:40,Plank:45,Cobra pose:40,Child’s pose:60","Advanced"],
["Yoga for Sleep","Yoga","Cat-cow:45,Child’s pose:60,Seated forward fold:45,Spinal twist:45,Legs up the wall:60","Beginner"],
["Pilates Sculpt","Pilates","The hundred:45,Roll-up:40,Single leg stretch:45,Scissor legs:40,Swimming:45,Glute bridge:45,Side-lying leg lifts:45","Intermediate"],
["Pilates Beginner Core","Pilates","Pelvic tilts:40,Glute bridge:40,Dead bugs:40,Swimming:30,Bird dog:40","Beginner"],
["Desk Break Stretch","Stretch","Neck rolls:30,Shoulder stretch:30,Seated twist:30,Hamstring stretch:30,Wrist stretch:20","Beginner"],
["Full Body Mobility","Stretch","Hip opener:40,Lunge stretch left:40,Lunge stretch right:40,Hamstring stretch:40,Spinal twist:40,Cobra pose:30","Intermediate"],
["Pilates Mat Basics","Pilates","Pelvic tilts:40,The hundred:40,Single leg stretch:40,Glute bridge:40,Spine twist:40,Cat-cow:40","Beginner"],
["Pilates Lower Body","Pilates","Side-lying leg lifts:45,Glute bridge:45,Squat pulses:40,Lunge pulses:40,Calf raises:40,Scissor legs:40","Intermediate"],
["Pilates Core Burner","Pilates","Single leg stretch:45,Criss-cross crunches:45,Dead bugs:45,Plank shoulder taps:40,Saw twist:40,Bird dog:40,Swimming:40","Intermediate"],
["Pilates Flow","Pilates","The hundred:45,Roll-up:45,Criss-cross crunches:45,Scissor legs:45,Swimming:45,Pilates push-ups:40,Plank:45,Child’s pose:45","Advanced"],
["Pilates Stretch and Reset","Pilates","Cat-cow:40,Mermaid stretch:40,Spine twist:40,Child’s pose:60,Hamstring stretch:40,Hip opener:40","Beginner"]];
const W=raw.map((r,i)=>{const ex=r[2].split(",").map(x=>{const p=x.split(":");return[p[0],+p[1]]});const sec=sum(ex,e=>e[1])+10*(ex.length-1),min=Math.round(sec/60);return{id:i,name:r[0],cat:r[1],ex,min,kcal:Math.round(min*rate[r[1]]),lv:r[3]||["Beginner","Intermediate","Intermediate","Beginner","Intermediate","Beginner","Intermediate","Beginner"][i]}});
const cats=["All","Cardio","Strength","Yoga","Pilates","Stretch"];
const B=[["Oats with banana and peanut butter",380],["Greek yoghurt, berries and granola",320],["Veggie scramble on wholegrain toast",350],["Overnight oats with chia and apple",340]],
L=[["Chicken and quinoa bowl",480],["Tuna salad wrap",420],["Lentil soup with wholegrain roll",440],["Turkey and avocado sandwich",460]],
Sn=[["Apple and almonds",180],["Hummus and carrot sticks",150],["Cottage cheese and cucumber",130]],
D=[["Baked salmon, rice and broccoli",540],["Stir-fried tofu and vegetables",450],["Lean beef chilli with beans",520],["Grilled chicken, sweet potato and greens",500]];
const plan=i=>[["Breakfast",B[i%4]],["Lunch",L[(i+1)%4]],["Snack",Sn[i%3]],["Dinner",D[(i+2)%4]]];
const dn=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let tab="today",cat="All",lv="All",wsel=null,msel=new Date().getDay(),note="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const burned=d=>sum(d.wo,w=>w.k),eaten=d=>sum(d.meals,m=>m.k);
const pct=(a,b)=>Math.min(100,Math.round(a/Math.max(1,b)*100));
function today(){const d=day(),bud=S.g.cal+burned(d),left=bud-eaten(d),C=2*Math.PI*52,off=C*(1-Math.min(1,eaten(d)/Math.max(1,bud)));
const lw=S.w.length?S.w[S.w.length-1].w:null;
return `<h1>${S.p&&S.p.n?"Hi, "+esc(S.p.n):"Today"}</h1><div class="mut">${new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</div>
<div class="card row sp"><svg width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="${eaten(d)} of ${bud} calories"><circle cx="65" cy="65" r="52" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="65" cy="65" r="52" fill="none" stroke="${left<0?"#e5484d":"var(--pri)"}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/><text x="65" y="63" text-anchor="middle" font-size="26" font-weight="800" fill="currentColor">${Math.abs(left)}</text><text x="65" y="82" text-anchor="middle" font-size="11" fill="var(--mut)">${left<0?"kcal over":"kcal left"}</text></svg>
<div style="flex:1"><div class="li"><span class="mut">Eaten</span><b>${eaten(d)}</b></div><div class="li"><span class="mut">Goal</span><b>${S.g.cal}</b></div><div class="li"><span class="mut">Burned</span><b>${burned(d)}</b></div></div></div>
<div class="card"><div class="row sp"><h3>Water</h3><span class="mut">${d.water} / ${S.g.water} ml</span></div><div class="bar" style="margin:10px 0"><i style="width:${pct(d.water,S.g.water)}%"></i></div><div class="row"><button class="sm" onclick="water(250)">+250 ml</button><button class="sm ghost" onclick="water(500)">+500 ml</button><button class="sm ghost" onclick="water(-250)">Undo</button></div></div>
<div class="card"><div class="row sp"><h3>Steps</h3><span class="mut">${d.steps.toLocaleString()} / ${S.g.steps.toLocaleString()}</span></div><div class="bar" style="margin:10px 0"><i style="width:${pct(d.steps,S.g.steps)}%"></i></div><div class="row"><input id="st" type="number" inputmode="numeric" placeholder="Steps to add" aria-label="Steps to add"><button onclick="addSteps()">Add</button></div></div>
<div class="card"><div class="row sp"><h3>Weight</h3><span class="mut">${lw?lw+" kg":"Not logged yet"}${S.g.wt?" · goal "+S.g.wt+" kg":""}</span></div><div class="row" style="margin-top:10px"><input id="wt" type="number" step="0.1" inputmode="decimal" placeholder="Today’s weight (kg)" aria-label="Weight in kg"><button onclick="logW()">Log</button></div></div>
<h2>Workouts today</h2>${d.wo.length?`<div class="card">${d.wo.map(w=>`<div class="li"><span>${esc(w.n)}</span><b>${w.k} kcal</b></div>`).join("")}</div>`:`<div class="card mut">No workout yet. Pick one in the Workouts tab.</div>`}`}
function workouts(){if(wsel!==null){const w=W[wsel];return `<button class="ghost sm" onclick="wsel=null;render()">Back</button><h1 style="margin-top:12px">${esc(w.name)}</h1><div class="mut">${w.cat} · ${w.lv} · about ${w.min} min · ~${w.kcal} kcal</div><div class="card">${w.ex.map(e=>`<div class="li"><span class="row">${fig(e[0],72)}<span>${esc(e[0])}<br><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[0]+" exercise form")}" target="_blank" rel="noopener" style="color:var(--pri2);font-size:14px">Watch a video</a></span></span><span class="mut">${e[1]} s</span></div>`).join("")}</div><div class="mut">Each move has a 10 second rest after it. Stop if anything hurts.</div><button style="width:100%;margin-top:14px;padding:14px" onclick="startW(${w.id})">Start workout</button>`}
return `<h1>Workouts</h1><div class="row wrap" style="margin:12px 0">${cats.map(c=>`<button class="chip ${c==cat?"on":""}" onclick="cat='${c}';render()">${c}</button>`).join("")}</div><div class="row wrap" style="margin:0 0 12px">${["All","Beginner","Intermediate","Advanced"].map(c=>`<button class="chip ${c==lv?"on":""}" onclick="lv='${c}';render()">${c}</button>`).join("")}</div>`+W.filter(w=>(cat=="All"||w.cat==cat)&&(lv=="All"||w.lv==lv)).map(w=>`<button class="wk" onclick="wsel=${w.id};render()"><span class="badge">${w.min}<br>min</span><span style="flex:1"><b>${esc(w.name)}</b><br><span class="mut">${w.cat} · ${w.lv} · ${w.ex.length} moves · ~${w.kcal} kcal</span></span></button>`).join("")}
function meals(){const d=day();return `<h1>Meals</h1><div class="mut">A simple 7-day plan. Tap Log to add a meal to today.</div><div class="row wrap" style="margin:12px 0">${dn.map((n,i)=>`<button class="chip ${i==msel?"on":""}" onclick="msel=${i};render()">${n}</button>`).join("")}</div><div class="card">${plan(msel).map(p=>`<div class="li"><span><span class="mut">${p[0]}</span><br>${esc(p[1][0])}<br><span class="mut">${p[1][1]} kcal</span></span><button class="sm" onclick="addFood(${JSON.stringify(p[1][0]).replace(/"/g,"&quot;")},${p[1][1]})">Log</button></div>`).join("")}<div class="mut" style="margin-top:8px">Day total: ${sum(plan(msel),p=>p[1][1])} kcal</div></div>
<h2>Add your own</h2><div class="card"><div class="row"><input id="fn" placeholder="Food or drink" aria-label="Food name"><input id="fk" type="number" inputmode="numeric" placeholder="kcal" style="width:90px" aria-label="Calories"></div><button style="margin-top:10px" onclick="addCustom()">Add to today</button></div>
<h2>Eaten today · ${eaten(d)} kcal</h2><div class="card">${d.meals.length?d.meals.map((m,i)=>`<div class="li"><span>${esc(m.n)}<br><span class="mut">${m.k} kcal</span></span><button class="sm ghost" onclick="delMeal(${i})">Remove</button></div>`).join(""):`<span class="mut">Nothing logged yet.</span>`}</div>`}
function progress(){const ws=S.w.slice(-30);let ch=`<div class="mut">Log at least two weights to see your chart.</div>`;
if(ws.length>1){const lo=Math.min(...ws.map(x=>x.w))-1,hi=Math.max(...ws.map(x=>x.w))+1,X=i=>20+i*(280/(ws.length-1)),Y=v=>120-(v-lo)/(hi-lo)*100,pts=ws.map((x,i)=>X(i)+","+Y(x.w)).join(" ");
ch=`<svg viewBox="0 0 320 140" width="100%" role="img" aria-label="Weight chart"><polyline points="${pts}" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linejoin="round"/>${ws.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="4" fill="var(--pri)"/>`).join("")}<text x="20" y="136" font-size="11" fill="var(--mut)">${ws[0].d.slice(5)}</text><text x="300" y="136" font-size="11" text-anchor="end" fill="var(--mut)">${ws[ws.length-1].d.slice(5)}</text><text x="20" y="12" font-size="11" fill="var(--mut)">${hi.toFixed(1)} kg</text><text x="20" y="104" font-size="11" fill="var(--mut)" opacity="0">.</text></svg>`}
const days=[...Array(7)].map((_,i)=>{const t=new Date();t.setDate(t.getDate()-6+i);const d=S.log[dk(t)]||{water:0,steps:0,meals:[],wo:[]};return{n:dn[t.getDay()],e:eaten(d),s:d.steps,w:d.wo.length}});
const mx=Math.max(S.g.cal,...days.map(x=>x.e));const first=S.w[0],last=S.w[S.w.length-1];
return `<h1>Progress</h1><div class="card"><h3>Weight</h3>${ch}${first&&last?`<div class="mut">Change since first entry: <b>${(last.w-first.w>0?"+":"")+(last.w-first.w).toFixed(1)} kg</b></div>`:""}</div>
<div class="card"><h3>Calories, last 7 days</h3><svg viewBox="0 0 320 130" width="100%" role="img" aria-label="Calories per day">${days.map((x,i)=>{const h=x.e/mx*90;return `<rect x="${i*45+8}" y="${100-h}" width="30" height="${h}" rx="6" fill="${x.e>S.g.cal?"#e5484d":"var(--pri)"}"/><text x="${i*45+23}" y="118" font-size="11" text-anchor="middle" fill="var(--mut)">${x.n}</text>`}).join("")}<line x1="0" x2="320" y1="${100-S.g.cal/mx*90}" y2="${100-S.g.cal/mx*90}" stroke="var(--pri2)" stroke-dasharray="4 4" stroke-width="2"/></svg></div>
<div class="card"><h3>This week</h3><div class="li"><span class="mut">Workouts done</span><b>${sum(days,x=>x.w)}</b></div><div class="li"><span class="mut">Total steps</span><b>${sum(days,x=>x.s).toLocaleString()}</b></div><div class="li"><span class="mut">Days within calorie goal</span><b>${days.filter(x=>x.e>0&&x.e<=S.g.cal).length}</b></div></div>
${S.w.length?`<h2>Weight history</h2><div class="card">${S.w.slice().reverse().slice(0,10).map(x=>`<div class="li"><span>${x.d}</span><b>${x.w} kg</b></div>`).join("")}</div>`:""}`}
function me(){return `<h1>Me</h1><div class="card"><h3>Daily goals</h3><label for="gc">Calories (kcal)</label><input id="gc" type="number" value="${S.g.cal}"><label for="gw">Water (ml)</label><input id="gw" type="number" value="${S.g.water}"><label for="gs">Steps</label><input id="gs" type="number" value="${S.g.steps}"><label for="gt">Goal weight (kg)</label><input id="gt" type="number" step="0.1" value="${S.g.wt}"><button style="margin-top:12px" onclick="saveGoals()">Save goals</button></div>
<div class="card"><h3>Profile and calorie calculator</h3><div class="mut">Saved on this device and used to estimate your daily calorie target.</div><label for="cn">Name</label><input id="cn" type="text" autocomplete="off"><div class="row"><div style="flex:1"><label for="ca">Age</label><input id="ca" type="number"></div><div style="flex:1"><label for="cs">Sex</label><select id="cs"><option value="m">Male</option><option value="f">Female</option></select></div></div><div class="row"><div style="flex:1"><label for="ch">Height (cm)</label><input id="ch" type="number"></div><div style="flex:1"><label for="cw">Weight (kg)</label><input id="cw" type="number"></div></div><label for="cv">Activity</label><select id="cv"><option value="1.2">Mostly sitting</option><option value="1.375" selected>Light activity</option><option value="1.55">Moderate activity</option><option value="1.725">Very active</option></select><label for="cg">Aim</label><select id="cg"><option value="-500">Lose weight</option><option value="0">Maintain</option><option value="300">Build muscle</option></select><div class="row" style="margin-top:12px"><button class="ghost" onclick="saveProfile()">Save profile</button><button onclick="calc()">Save and set calorie goal</button></div><div id="cr" class="mut" style="margin-top:8px">${esc(note)}</div></div>
<div class="mut">Your data stays on this device in this browser. This app gives general fitness guidance, not medical advice. Check with a doctor before starting a new exercise or diet plan.</div><button class="ghost sm" style="margin-top:12px" onclick="if(confirm('Delete all your data?')){S={g:{cal:2000,water:2000,steps:8000,wt:''},log:{},w:[]};save();render()}">Delete all data</button>`}
function render(){const v={today,workouts,meals,progress,me}[tab]();$("#app").innerHTML=v;$("#nav").innerHTML=[["today","Today"],["workouts","Workouts"],["meals","Meals"],["progress","Progress"],["me","Me"]].map(t=>`<button class="${t[0]==tab?"on":""}" onclick="go('${t[0]}')" ${t[0]==tab?'aria-current="page"':""}>${t[1]}</button>`).join("")}

const fig=(n,s)=>{const r=R.find(x=>x[0].test(n.toLowerCase()));return `<svg class="fg" data-m="${r?r[1]:"reach"}" viewBox="0 0 100 100" width="${s}" height="${s}" role="img" aria-label="Animated demo: ${esc(n)}"></svg>`};
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches,LN=[[1,2],[1,3],[3,4],[1,5],[5,6],[2,7],[7,8],[2,9],[9,10],[0,1]];
function paint(){const k=RM?0:.5-.5*Math.cos(Date.now()/420);document.querySelectorAll(".fg").forEach(s=>{const m=M[s.dataset.m],p=m[0].map((a,i)=>a+(m[1][i]-a)*k);let h='<line x1="4" x2="96" y1="91" y2="91" stroke="var(--line)" stroke-width="2"/><g stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none">';LN.forEach(l=>h+=`<line x1="${p[l[0]*2]}" y1="${p[l[0]*2+1]}" x2="${p[l[1]*2]}" y2="${p[l[1]*2+1]}"/>`);s.innerHTML=h+`<circle cx="${p[0]}" cy="${p[1]}" r="7"/></g>`})}

function fillP(){const p=S.p||{},set=(i,v)=>{const e=$("#"+i);if(e&&v!==undefined&&v!=="")e.value=v};set("cn",p.n);set("ca",p.a);set("cs",p.s);set("ch",p.h);set("cw",p.w||(S.w.length?S.w[S.w.length-1].w:""));set("cv",p.v);set("cg",p.g)}
const _rn=render;render=function(){_rn();fillP()};
function water(n){const d=day();d.water=Math.max(0,d.water+n);save();render()}
function addSteps(){const n=parseInt($("#st").value);if(n>0){day().steps+=n;save()}render()}
function logW(){const v=parseFloat($("#wt").value);if(!(v>0))return;const k=dk(),e=S.w.find(x=>x.d==k);e?e.w=v:S.w.push({d:k,w:v});save();render()}
function addFood(n,k){day().meals.push({n,k});save();render()}
function addCustom(){const n=$("#fn").value.trim(),k=parseInt($("#fk").value);if(n&&k>0)addFood(n,k)}
function delMeal(i){day().meals.splice(i,1);save();render()}
function saveGoals(){S.g={cal:+$("#gc").value||2000,water:+$("#gw").value||2000,steps:+$("#gs").value||8000,wt:$("#gt").value};save();note="Goals saved.";render()}
function saveProfile(q){S.p={n:$("#cn").value.trim(),a:$("#ca").value,s:$("#cs").value,h:$("#ch").value,w:$("#cw").value,v:$("#cv").value,g:$("#cg").value};const w=parseFloat(S.p.w);if(w>0){const k=dk(),e=S.w.find(x=>x.d==k);e?e.w=w:S.w.push({d:k,w})}save();if(!q){note="Profile saved.";render()}}
function calc(){saveProfile(1);const a=+$("#ca").value,h=+$("#ch").value,w=+$("#cw").value;if(!(a&&h&&w)){$("#cr").textContent="Fill in age, height and weight.";return}
const bmr=10*w+6.25*h-5*a+($("#cs").value=="m"?5:-161),t=Math.max(1200,Math.round(bmr*$("#cv").value+ +$("#cg").value));S.g.cal=t;save();note="Your estimated daily target is "+t+" kcal. It has been set as your goal.";render()}
let P=null,tm=null;
function startW(id){const w=W[id],seq=[];w.ex.forEach((e,i)=>{seq.push({n:e[0],s:e[1]});if(i<w.ex.length-1)seq.push({n:"Rest",s:10})});P={w,seq,i:0,t:seq[0].s,p:false};$("#pl").style.display="flex";clearInterval(tm);tm=setInterval(tick,1000);drawP()}
function tick(){if(!P||P.p)return;if(--P.t<=0)return nextP();drawP()}
function nextP(){if(++P.i>=P.seq.length)return finishP();P.t=P.seq[P.i].s;drawP()}
function drawP(){const c=P.seq[P.i],nx=P.seq[P.i+1];$("#pl").innerHTML=`<div class="row sp"><span>${esc(P.w.name)}</span><span>${pct(P.i,P.seq.length)}%</span></div><div>${c.n=="Rest"?"":fig(c.n,190)}<h2 style="margin:0 0 8px;font-size:34px">${esc(c.n)}</h2><div class="t">${P.t}</div><div style="margin-top:12px;opacity:.75">${nx?"Next: "+esc(nx.n):"Last one"}</div></div><div class="row"><button class="ghost" style="flex:1" onclick="endP()">End</button><button style="flex:1" onclick="P.p=!P.p;drawP()">${P.p?"Resume":"Pause"}</button><button class="ghost" style="flex:1" onclick="nextP()">Skip</button></div>`}
function finishP(){clearInterval(tm);const w=P.w;day().wo.push({n:w.name,k:w.kcal});save();P=null;$("#pl").innerHTML=`<div></div><div><h2 style="font-size:36px;margin:0 0 8px">Workout complete</h2><div style="opacity:.8">${esc(w.name)} · about ${w.kcal} kcal burned</div></div><button onclick="endP()">Done</button>`}
function endP(){clearInterval(tm);P=null;$("#pl").style.display="none";render()}
